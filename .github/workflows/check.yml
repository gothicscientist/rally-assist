name: Verify extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:ui
      - run: npm run screenshots
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: rally-assist-screenshots
          path: |
            docs/media/*.png
            docs/media/preview.svg
          if-no-files-found: error
  publish-captures:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rally-assist-screenshots
          path: docs/media
      - name: Commit verified UI captures
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source revision exists; skip stale captures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/overview.png docs/media/panel.png docs/media/minimized.png docs/media/narrow.png docs/media/preview.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh verified extension screenshots"
            git push origin HEAD:main
          fi
