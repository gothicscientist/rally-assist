<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rally Assist · UI preview</title>
<style>
html,body{margin:0;min-height:100%;background:#101418;color:#f4f3ef;font-family:system-ui}main{padding:80px;max-width:620px}h1{font-weight:550;font-size:62px;letter-spacing:-.04em;line-height:1.06;margin:0 0 24px}p{font-size:18px;color:#aeb8bf;line-height:1.65}small{color:#fba66b;font-size:13px}.caption{font-size:12px;margin-top:180px}.tools{position:fixed;bottom:20px;left:20px;max-width:calc(100vw - 40px);display:flex;flex-wrap:wrap;gap:6px}.tools button{border:1px solid #57616a;background:#242a2f;color:#f4f3ef;padding:7px;border-radius:5px;cursor:pointer}.tools button:focus-visible{outline:2px solid #fba66b}.capture .tools{display:none}@media(max-width:800px){main{padding:24px}main h1,main p:not(.caption),main small{display:none}.caption{position:fixed;bottom:0;font-size:10px;max-width:240px}}
</style></head><body><main><h1>Your side<br>of the table.</h1><p>Perfect contact. Deliberate placement.<br>A compact control panel for Rally.</p><small>Rally Assist / Browser extension</small><p class="caption">UI demonstration · Local fixture, not a live match.</p></main>
<div class="tools" aria-label="Preview fixture states"><button data-state="ready">Ready</button><button data-state="active">Active</button><button data-state="paused">Paused</button><button data-state="replay">Replay</button><button data-state="unsupported">Unsupported</button><button data-state="waiting">Waiting</button><button id="demo-hit">Simulate hit</button><button id="demo-corrupt">Corrupt saved settings</button><input aria-label="Shortcut guard test" placeholder="Type here to test shortcuts"></div>
<script src="/demo.js"></script><script src="/core.js"></script><script src="/panel.js"></script>
</body></html>
